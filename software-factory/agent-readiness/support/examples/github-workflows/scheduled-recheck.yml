# Copy to .github/workflows/agent-readiness-recheck.yml in the audited repo.
# Weekly, reruns the verification contract recorded in the last sealed audit, in a clean container,
# with no agent involved. A failure lowers a level; a later pass restores it; a recheck never raises one.
# It runs the scripts from a pinned accelerator release rather than the copy in the repo, checks the
# last audit's seal against that release, and appends the result to the agent-readiness/history branch.
name: agent-readiness-recheck
on:
  schedule:
    - cron: "0 13 * * 1"
  workflow_dispatch:
permissions:
  contents: write
env:
  SA_ACCELERATOR_REPO: cursor/cookbook
  # The cursor/cookbook commit you copied the skill from: the hash `git -C /tmp/cookbook rev-parse HEAD`
  # printed in the README's quickstart, which clones release agent-readiness-v0.2.0. Pin that commit,
  # not the tag or a branch, since a commit can't move.
  SA_ACCELERATOR_REF: ""
  SA_READINESS: node --experimental-strip-types --no-warnings .readiness-accelerator/software-factory/agent-readiness/skill/agent-readiness/scripts/readiness.ts
  # The key the audits were sealed with. Without it, seals are unkeyed digests: they catch edits,
  # but anyone with the scripts could reseal an edited audit.
  SA_READINESS_SEAL_KEY: ${{ secrets.AGENT_READINESS_SEAL_KEY }}
jobs:
  recheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # The history branch exists once an audit is sealed and pushed (readiness history push --push).
      # Until then there's nothing to recheck, and the job says so instead of failing.
      - name: Fetch the history branch
        id: history
        run: |
          if git fetch origin agent-readiness/history:agent-readiness/history; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::No agent-readiness/history branch yet: run an audit, seal it and push its history (readiness history push --push). Nothing to recheck."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Check the pin
        run: |
          if [ -z "$SA_ACCELERATOR_REF" ]; then
            echo "::error::Set SA_ACCELERATOR_REF in this workflow to the cursor/cookbook commit you copied the skill from (git -C /tmp/cookbook rev-parse HEAD in the quickstart)."
            exit 1
          fi
      - uses: actions/setup-node@v4
        if: steps.history.outputs.found == 'true'
        with:
          node-version: 22
      - name: Check out the pinned accelerator
        if: steps.history.outputs.found == 'true'
        uses: actions/checkout@v4
        with:
          repository: ${{ env.SA_ACCELERATOR_REPO }}
          ref: ${{ env.SA_ACCELERATOR_REF }}
          path: .readiness-accelerator
          sparse-checkout: software-factory/agent-readiness/skill
      - name: Verify the last audit's seal against the release
        if: steps.history.outputs.found == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        # Audits sealed on a laptop are unkeyed. Keep --allow-unkeyed until audits are sealed in CI
        # with the key; then drop it, so a seal from anywhere else no longer verifies here.
        run: $SA_READINESS verify-seal latest --release-repo "$SA_ACCELERATOR_REPO" --release-ref "$SA_ACCELERATOR_REF" --tier external-systems --allow-unkeyed
      - name: Recheck
        if: steps.history.outputs.found == 'true'
        id: recheck
        run: $SA_READINESS recheck
        # Private registries: add `--registry-env NPM_TOKEN` to the audit, and pass the secret here:
        # env:
        #   NPM_TOKEN: ${{ secrets.NPM_READ_TOKEN }}
      - name: Append to the history branch
        if: always() && steps.history.outputs.found == 'true' && steps.recheck.outcome != 'skipped'
        run: $SA_READINESS history push --push

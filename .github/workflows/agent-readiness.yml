name: agent-readiness

on:
  push:
    branches: [main, "cursor/agent-readiness-0.2"]
    paths: ["software-factory/agent-readiness/**", ".github/workflows/agent-readiness.yml"]
  pull_request:
    paths: ["software-factory/agent-readiness/**", ".github/workflows/agent-readiness.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-readiness-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash
    working-directory: software-factory/agent-readiness

jobs:
  # Docs-only pull requests skip the trials and the negative evals. support/tools/ci-scope.ts decides
  # from the diff, run from the base's copy so a PR can't widen its own list; any other path, any
  # error, a push or a manual run means the full run.
  scope:
    name: Docs-only or full run
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        if: github.event_name == 'pull_request'
        with:
          node-version-file: software-factory/agent-readiness/.nvmrc
      - id: scope
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "full: a ${{ github.event_name }} run is always a full run"
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tool="$RUNNER_TEMP/ci-scope.ts"
          if ! git show "origin/${{ github.base_ref }}:software-factory/agent-readiness/support/tools/ci-scope.ts" > "$tool"; then
            echo "full: the base has no support/tools/ci-scope.ts"
            echo "scope=full" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          node --experimental-strip-types --no-warnings "$tool" --base "origin/${{ github.base_ref }}" --head HEAD
        working-directory: .

  check:
    name: npm run check (Docker, no skips)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: software-factory/agent-readiness/.nvmrc
          cache: npm
          cache-dependency-path: software-factory/agent-readiness/package-lock.json
      - name: Docker is available
        run: docker info --format 'Docker {{.ServerVersion}}'
      - run: npm ci
      - name: npm run check
        run: |
          set -o pipefail
          npm run check 2>&1 | tee "$RUNNER_TEMP/check.log"
      - name: No suite skipped
        if: always()
        run: support/tools/no-skips.sh "$RUNNER_TEMP/check.log"

  trials:
    name: Pinned trial repos (Docker)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs-only' }}
    runs-on: ubuntu-24.04
    # 18 repos, two at a time; Flexget's suite alone takes a quarter of an hour.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: software-factory/agent-readiness/.nvmrc
          cache: npm
          cache-dependency-path: software-factory/agent-readiness/package-lock.json
      - name: Docker is available
        run: docker info --format 'Docker {{.ServerVersion}}'
      - run: npm ci
      - name: npm run trials
        run: |
          set -o pipefail
          npm run trials 2>&1 | tee "$RUNNER_TEMP/trials.log"
      - name: No trial skipped
        if: always()
        run: support/tools/no-skips.sh "$RUNNER_TEMP/trials.log"

  negative-evals:
    name: Scripted negative evals (Docker, no API key)
    needs: scope
    if: ${{ !cancelled() && needs.scope.outputs.scope != 'docs-only' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # The scripted negative cases need no API key. Left out: remediation/compose-env-honest and
      # remediation/draft-env-service-honest (Debian packages) and scenarios/scenario-repo-wide-honest
      # (PyPI), which need package registries. tests/workflow.test.ts keeps this list in step.
      NEGATIVE_CASES: >-
        multi-audit/diff-catches-weakening-honest,multi-audit/drops-below-share-honest,
        multi-audit/new-component-joins-honest,multi-audit/recheck-regression-honest,
        multi-audit/recheck-restore-honest,multi-audit/skip-failing-tests,
        negative/drop-db-setup,negative/forged-reseal,negative/forged-reseal-latest,
        negative/hash-test-oracle,negative/honest-fix,negative/seal-tamper,
        outcomes/level-3-outcomes-honest,
        platforms/dotnet-ios-monorepo-blocked-honest,platforms/ios-repo-defect-headline,
        platforms/ios-xcode-blocked-honest,platforms/windows-dotnet-blocked-honest,
        platforms/windows-network-off-headline,platforms/windows-repo-defect-headline,outcomes/level-3-short-window-honest,
        outcomes/level-4-failed-recheck-honest,outcomes/level-4-streak-honest,
        outcomes/reverts-reported-honest,
        remediation/draft-verify-skill-honest,remediation/fix-instructions-honest,
        remediation/fix-safety-hook-honest,remediation/fix-typecheck-coverage-honest,
        scenarios/scenario-components-honest,scope/sampled-scope-honest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: software-factory/agent-readiness/.nvmrc
          cache: npm
          cache-dependency-path: software-factory/agent-readiness/package-lock.json
      - name: Docker is available
        run: docker info --format 'Docker {{.ServerVersion}}'
      - run: npm ci
      - name: npm run evals (scripted negative cases)
        run: npm run evals -- --tag negative --case "${NEGATIVE_CASES// /}" --concurrency 3

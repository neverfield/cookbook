name: agent-readiness instrument freeze

# A pull request may change the accelerator's scripts or the instrument that measures them, not both,
# and may not assert less without saying why (support/tools/instrument-freeze.ts). Its own workflow,
# so editing the description to add an exception reruns this check alone.
on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    paths: ["software-factory/agent-readiness/**", ".github/workflows/agent-readiness*.yml"]

permissions:
  contents: read

concurrency:
  group: agent-readiness-freeze-${{ github.ref }}
  cancel-in-progress: true

jobs:
  freeze:
    name: Scripts and instrument don't change together
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
        working-directory: software-factory/agent-readiness
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: software-factory/agent-readiness/.nvmrc
      # The base's copy decides, so a PR can't loosen the rules it is judged by. A base from before
      # the ledger has no copy that prints it, so this PR's copy runs once, until it lands.
      - name: Instrument freeze and assertion ledger
        env:
          SA_PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          tool="$RUNNER_TEMP/instrument-freeze.ts"
          git show "origin/${{ github.base_ref }}:software-factory/agent-readiness/support/tools/instrument-freeze.ts" > "$tool"
          if ! grep -q "ledgerOf" "$tool"; then
            echo "The base's instrument-freeze.ts has no assertion ledger yet; running this pull request's copy."
            tool=support/tools/instrument-freeze.ts
          fi
          node --experimental-strip-types --no-warnings "$tool" --base "origin/${{ github.base_ref }}" --head HEAD
